name: Release

# Tag a commit with v* (for example `git tag v0.1.0 && git push origin v0.1.0`)
# to run the full quality gate and publish a GitHub release with the compiled
# dist/ bundle attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Package release asset
        run: tar -czf "zhishi-${GITHUB_REF_NAME}.tar.gz" dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "zhishi-${GITHUB_REF_NAME}.tar.gz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
