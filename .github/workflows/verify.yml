name: Verify

# Reusable quality gate: typecheck, tests against a real PostgreSQL 18 (pgvector)
# service, and a production TypeScript build. Called by ci.yml and release.yml so
# the gates can never drift between pull requests and releases.

on:
  workflow_call:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/wechat_claw
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wechat_claw_test

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wechat_claw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wechat_claw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wechat_claw_test'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
